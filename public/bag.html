<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#00585A">
  <title>Your bag · 7 Sentidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/site.js"></script>
</head>
<body>
  <site-header current="bag"></site-header>

  <main>
    <section class="wrap pad" style="--pt: 72px; --pb: 112px; color: var(--teal)">
      <h1 style="margin-bottom: 40px">Your bag</h1>

      <div class="empty" id="bag-empty" hidden>
        <p>Your bag is empty. Pick a flavour to fill it.</p>
        <a class="btn btn--teal" href="flavour.html">Choose a flavour</a>
      </div>

      <div class="bag" id="bag-full" hidden>
        <ul class="bag__lines" id="bag-lines"></ul>

        <div class="summary">
          <h2>Order summary</h2>
          <div class="summary__row"><span>Subtotal</span><span id="bag-subtotal">€0,00</span></div>
          <div class="summary__row"><span>Delivery</span><span>[your delivery price]</span></div>
          <p style="margin-top: 18px">Delivered across the Netherlands in 1–3 working days.</p>
          <button type="button" class="btn btn--lg btn--orange" id="checkout">Go to checkout</button>
          <p class="small">[Payment methods you accept]</p>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script>
    const linesEl = document.getElementById("bag-lines");
    const emptyEl = document.getElementById("bag-empty");
    const fullEl = document.getElementById("bag-full");
    const subtotalEl = document.getElementById("bag-subtotal");

    function lineHTML(id, qty) {
      const p = PRODUCTS[id];
      const name = escapeHTML(p.name);
      return `
        <li class="bag__line" data-id="${id}">
          <div class="bag__thumb" role="img" aria-label="7 Sentidos ${name} pouch"><img src="${ASSETS}${p.pouch}" alt="" width="880" height="1444"></div>
          <div class="bag__name"><strong>${name}</strong>${escapeHTML(p.detail)}</div>
          <div class="stepper" role="group" aria-label="Quantity of ${name}">
            <button type="button" data-step="-1" aria-label="Remove one ${name}">−</button>
            <output aria-live="polite">${qty}</output>
            <button type="button" data-step="1" aria-label="Add one ${name}">+</button>
          </div>
          <div class="bag__total">${formatPrice(p.price * qty)}</div>
        </li>`;
    }

    function renderTotals() {
      const items = bag.read();
      const subtotal = Object.entries(items).reduce((sum, [id, qty]) => sum + PRODUCTS[id].price * qty, 0);
      subtotalEl.textContent = formatPrice(subtotal);
      const isEmpty = Object.keys(items).length === 0;
      emptyEl.hidden = !isEmpty;
      fullEl.hidden = isEmpty;
    }

    function render() {
      const items = bag.read();
      linesEl.innerHTML = Object.entries(items).map(([id, qty]) => lineHTML(id, qty)).join("");

      linesEl.querySelectorAll(".bag__line").forEach((line) => {
        const id = line.dataset.id;
        stepper(line.querySelector(".stepper"), {
          value: items[id],
          min: 0,
          onChange: (qty) => {
            bag.set(id, qty);
            if (qty === 0) {
              const removeLine = () => {
                line.remove();
                renderTotals();
                const next = linesEl.querySelector(".stepper button");
                (next || document.querySelector("#bag-empty a")).focus();
              };
              if (reducedMotion()) removeLine();
              else {
                line.classList.add("is-leaving");
                line.addEventListener("animationend", removeLine, { once: true });
              }
              return;
            } else {
              line.querySelector(".bag__total").textContent = formatPrice(PRODUCTS[id].price * qty);
            }
            renderTotals();
          },
        });
      });

      renderTotals();
    }

    // Keep in step if the bag changes in another tab
    window.addEventListener("storage", render);

    render();
  </script>
</body>
</html>
